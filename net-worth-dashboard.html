<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30-Year Net Worth Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-all.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #222536; --border: #2e3250;
      --accent: #6c63ff; --accent2: #00d4aa; --accent3: #ff6b6b;
      --text: #e2e8f0; --muted: #8892a4; --radius: 10px;
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

    /* ── Header ── */
    header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    header h1 { font-size: 1.05rem; font-weight: 700; }
    .hdr-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .hdr-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; color: var(--muted); font-size: 0.78rem; padding: 5px 12px; cursor: pointer; transition: all 0.15s; }
    .hdr-btn:hover { border-color: var(--accent); color: var(--text); }
    .hdr-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Two-column layout ── */
    .layout { display: grid; grid-template-columns: 296px 1fr; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 12px 14px; overflow-y: auto; }
    .section-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin: 12px 0 6px; }
    .section-label:first-child { margin-top: 0; }
    .field { margin-bottom: 7px; }
    .field label { display: block; font-size: 0.73rem; color: var(--muted); margin-bottom: 3px; }
    .field input, .field select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 0.8rem; outline: none; transition: border-color 0.2s; }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field select option { background: var(--surface2); }
    .pfx { position: relative; } .pfx .pre { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.78rem; pointer-events: none; } .pfx input { padding-left: 20px; }
    .sfx { position: relative; } .sfx .suf { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.78rem; pointer-events: none; } .sfx input { padding-right: 26px; }
    .tax-summary { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; font-size: 0.72rem; color: var(--muted); margin-bottom: 7px; }
    .tax-summary .row { display: flex; justify-content: space-between; padding: 1px 0; }
    .tax-summary .row span:last-child { color: var(--text); font-weight: 600; }
    .tax-summary .total { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; color: var(--text); font-weight: 700; }
    .expense-builder { display: flex; flex-direction: column; }
    .exp-row { display: grid; grid-template-columns: 1fr 82px 22px; gap: 4px; align-items: center; margin-bottom: 4px; }
    .exp-row input[type="text"] { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 7px; color: var(--text); font-size: 0.75rem; outline: none; }
    .exp-row input[type="text"]:focus { border-color: var(--accent); }
    .exp-row .money { position: relative; }
    .exp-row .money span { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.73rem; pointer-events: none; }
    .exp-row .money input { padding: 4px 7px 4px 14px; width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.75rem; outline: none; }
    .exp-row .money input:focus { border-color: var(--accent); }
    .exp-row button { background: none; border: 1px solid var(--accent3); border-radius: 5px; color: var(--accent3); cursor: pointer; font-size: 0.95rem; width: 22px; height: 24px; display: flex; align-items: center; justify-content: center; opacity: 0.6; transition: all 0.15s; }
    .exp-row button:hover { opacity: 1; background: rgba(255,107,107,0.12); }
    .exp-total { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; font-size: 0.75rem; display: flex; justify-content: space-between; margin-top: 3px; margin-bottom: 7px; }
    .exp-total span:last-child { color: var(--accent2); font-weight: 700; }
    .add-exp-btn { background: none; border: 1px dashed var(--border); border-radius: 6px; color: var(--muted); font-size: 0.72rem; padding: 4px; cursor: pointer; width: 100%; margin-bottom: 5px; transition: all 0.15s; }
    .add-exp-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Main ── */
    .main { display: flex; flex-direction: column; padding: 10px; overflow: hidden; gap: 0; }

    /* ── Edit mode banner ── */
    .edit-bar { display: none; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 10px; background: rgba(108,99,255,0.08); border: 1px dashed var(--accent); border-radius: 8px; margin-bottom: 8px; flex-shrink: 0; }
    body.editing .edit-bar { display: flex; }
    .edit-bar-label { font-size: 0.7rem; color: var(--accent); font-weight: 600; }
    .add-widget-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 0.72rem; padding: 3px 10px; cursor: pointer; transition: all 0.15s; }
    .add-widget-chip:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Gridstack overrides ── */
    .grid-stack { flex: 1; min-height: 0; background: transparent; }
    .grid-stack-item-content { border-radius: var(--radius); overflow: hidden; }

    /* ── Widget card ── */
    .wcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); height: 100%; display: flex; flex-direction: column; overflow: hidden; transition: border-color 0.2s; }
    body.editing .wcard { border-color: var(--accent); border-style: dashed; }
    .whdr { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; user-select: none; }
    .wdrag { color: var(--muted); font-size: 1rem; cursor: grab; display: none; line-height: 1; }
    body.editing .wdrag { display: block; }
    .wtitle { font-size: 0.65rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; flex: 1; }
    .wclose { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 0 2px; line-height: 1; display: none; transition: color 0.15s; }
    .wclose:hover { color: var(--accent3); }
    body.editing .wclose { display: block; }
    .wbody { flex: 1; min-height: 0; padding: 10px 14px; overflow: hidden; display: flex; flex-direction: column; }
    .wbody.nopad { padding: 0; }
    .wbody canvas { flex: 1; min-height: 0; width: 100% !important; }

    /* ── Milestones widget ── */
    .ms-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; }
    .ms-cell { background: var(--surface2); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; }
    .ms-yr { font-size: 0.68rem; color: var(--muted); margin-bottom: 3px; }
    .ms-val { font-size: 1.25rem; font-weight: 700; color: var(--accent); }

    /* ── Table widget ── */
    .table-scroll { overflow-y: auto; flex: 1; min-height: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    thead th { background: var(--surface2); padding: 7px 13px; text-align: right; color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; position: sticky; top: 0; z-index: 1; }
    thead th:first-child { text-align: left; }
    tbody tr { border-top: 1px solid var(--border); }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 6px 13px; text-align: right; }
    tbody td:first-child { text-align: left; font-weight: 600; }
    .pos { color: var(--accent2); } .neg { color: var(--accent3); }
    .mbadge { display: inline-block; background: var(--accent); color: #fff; border-radius: 3px; font-size: 0.58rem; padding: 1px 5px; margin-left: 4px; font-weight: 700; vertical-align: middle; }

    /* ── Tax breakdown widget ── */
    .tax-bars { display: flex; flex-direction: column; gap: 8px; flex: 1; justify-content: center; }
    .tax-bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; }
    .tax-bar-label { width: 130px; color: var(--muted); flex-shrink: 0; }
    .tax-bar-track { flex: 1; background: var(--surface2); border-radius: 4px; height: 8px; overflow: hidden; }
    .tax-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .tax-bar-val { width: 90px; text-align: right; font-weight: 600; color: var(--text); flex-shrink: 0; }
  </style>
</head>
<body>

<header>
  <span>📈</span>
  <h1>30-Year Net Worth Projection</h1>
  <div class="hdr-actions">
    <button class="hdr-btn" onclick="resetLayout()">Reset Layout</button>
    <button class="hdr-btn" id="editBtn" onclick="toggleEdit()">Edit Layout</button>
  </div>
</header>

<div class="layout">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="section-label">Starting Point</div>
    <div class="field">
      <label>Current Net Worth / Savings</label>
      <div class="pfx"><span class="pre">$</span><input type="number" id="netWorth" value="25000" min="0" oninput="calculate()" /></div>
    </div>

    <div class="section-label">Income</div>
    <div class="field">
      <label>Gross Annual Salary</label>
      <div class="pfx"><span class="pre">$</span><input type="number" id="salary" value="80000" min="0" oninput="calculate()" /></div>
    </div>
    <div class="field">
      <label>Filing Status</label>
      <select id="filingStatus" onchange="calculate()">
        <option value="single">Single</option>
        <option value="mfj">Married Filing Jointly</option>
        <option value="hoh">Head of Household</option>
      </select>
    </div>
    <div class="field">
      <label>State</label>
      <select id="state" onchange="calculate()"></select>
    </div>

    <div class="tax-summary">
      <div class="row"><span>Federal Income Tax</span><span id="ts-fed">—</span></div>
      <div class="row"><span>FICA (SS + Medicare)</span><span id="ts-fica">—</span></div>
      <div class="row"><span>State Income Tax</span><span id="ts-state">—</span></div>
      <div class="row total"><span>Effective Total Rate</span><span id="ts-total">—</span></div>
    </div>

    <div class="field">
      <label>Annual Income Growth Rate</label>
      <div class="sfx"><span class="suf">%</span><input type="number" id="incomeGrowth" value="3" min="0" max="30" step="0.1" oninput="calculate()" /></div>
    </div>

    <div class="section-label">Expenses (Monthly)</div>
    <div class="expense-builder" id="expenseBuilder"></div>
    <button class="add-exp-btn" onclick="addExpenseRow()">+ Add category</button>
    <div class="exp-total"><span>Total Annual Expenses</span><span id="expTotal">$0</span></div>

    <div class="section-label">Growth & Returns</div>
    <div class="field">
      <label>Annual Expense Growth Rate (inflation)</label>
      <div class="sfx"><span class="suf">%</span><input type="number" id="expenseGrowth" value="2.5" min="0" max="20" step="0.1" oninput="calculate()" /></div>
    </div>
    <div class="field">
      <label>Expected Annual Investment Return</label>
      <div class="sfx"><span class="suf">%</span><input type="number" id="investReturn" value="7" min="0" max="30" step="0.1" oninput="calculate()" /></div>
    </div>
    <div class="field">
      <label>% of Net Worth in Investments (rest is cash)</label>
      <div class="sfx"><span class="suf">%</span><input type="number" id="investPct" value="80" min="0" max="100" step="1" oninput="calculate()" /></div>
    </div>
    <div class="field">
      <label>Years to Project</label>
      <input type="number" id="years" value="30" min="5" max="50" oninput="calculate()" />
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <main class="main" id="mainArea">
    <!-- Edit mode banner: shows available hidden widgets -->
    <div class="edit-bar" id="editBar">
      <span class="edit-bar-label">Add widget:</span>
      <!-- chips injected by JS -->
    </div>
    <div class="grid-stack" id="grid"></div>
  </main>
</div>

<script>
// ─── TAX DATA ────────────────────────────────────────────────────────────────
const STATES = {

  WY:{name:'Wyoming',d:{s:0,m:0,h:0},b:[]},
  AL:{name:'Alabama',d:{s:2500,m:7500,h:4700},b:[[500,.02],[3000,.04],[1e9,.05]]},
  AR:{name:'Arkansas',d:{s:2200,m:4400,h:2200},b:[[4300,.02],[8500,.04],[1e9,.049]]},
  AZ:{name:'Arizona',d:{s:14600,m:29200,h:21900},b:[[1e9,.025]]},
  CA:{name:'California',d:{s:4803,m:9606,h:9606},b:[[10099,.01],[23942,.02],[37788,.04],[52455,.06],[66295,.08],[338639,.093],[406364,.103],[677275,.113],[1e9,.123]]},
  CO:{name:'Colorado',d:{s:14600,m:29200,h:21900},b:[[1e9,.044]]},
  CT:{name:'Connecticut',d:{s:15000,m:24000,h:19000},b:[[10000,.03],[50000,.05],[100000,.055],[200000,.06],[250000,.065],[500000,.069],[1e9,.0699]]},
  DC:{name:'D.C.',d:{s:14600,m:29200,h:21900},b:[[10000,.04],[40000,.06],[60000,.065],[250000,.085],[500000,.0925],[1000000,.1025],[1e9,.1075]]},
  DE:{name:'Delaware',d:{s:3250,m:6500,h:3250},b:[[2000,0],[5000,.022],[10000,.039],[20000,.048],[25000,.052],[60000,.055],[1e9,.066]]},
  GA:{name:'Georgia',d:{s:12000,m:24000,h:18000},b:[[1e9,.0549]]},
  HI:{name:'Hawaii',d:{s:2200,m:4400,h:3212},b:[[2400,.014],[4800,.032],[9600,.055],[14400,.064],[19200,.068],[24000,.072],[36000,.076],[48000,.079],[150000,.0825],[175000,.09],[200000,.1],[1e9,.11]]},
  IA:{name:'Iowa',d:{s:14600,m:29200,h:21900},b:[[1e9,.057]]},
  ID:{name:'Idaho',d:{s:14600,m:29200,h:21900},b:[[1e9,.058]]},
  IL:{name:'Illinois',d:{s:0,m:0,h:0},b:[[1e9,.0495]]},
  IN:{name:'Indiana',d:{s:1000,m:2000,h:1000},b:[[1e9,.0305]]},
  KS:{name:'Kansas',d:{s:3000,m:7500,h:3000},b:[[15000,.031],[30000,.0525],[1e9,.057]]},
  KY:{name:'Kentucky',d:{s:2980,m:5960,h:2980},b:[[1e9,.04]]},
  LA:{name:'Louisiana',d:{s:4500,m:9000,h:4500},b:[[12500,.0185],[50000,.035],[1e9,.0425]]},
  MA:{name:'Massachusetts',d:{s:0,m:0,h:0},b:[[1000000,.05],[1e9,.09]]},
  MD:{name:'Maryland',d:{s:2400,m:4850,h:2400},b:[[1000,.02],[2000,.03],[3000,.04],[100000,.0475],[125000,.05],[150000,.0525],[250000,.055],[1e9,.0575]]},
  ME:{name:'Maine',d:{s:14600,m:29200,h:21900},b:[[24500,.058],[58050,.0675],[1e9,.0715]]},
  MI:{name:'Michigan',d:{s:5400,m:10800,h:5400},b:[[1e9,.0425]]},
  MN:{name:'Minnesota',d:{s:14575,m:29150,h:21863},b:[[30070,.0535],[98760,.068],[163060,.0785],[1e9,.0985]]},
  MO:{name:'Missouri',d:{s:14600,m:29200,h:21900},b:[[1121,.015],[2242,.02],[3363,.025],[4484,.03],[5605,.035],[6726,.04],[7847,.045],[1e9,.048]]},
  MS:{name:'Mississippi',d:{s:2300,m:4600,h:3400},b:[[10000,0],[1e9,.05]]},
  MT:{name:'Montana',d:{s:14600,m:29200,h:21900},b:[[20500,.047],[1e9,.059]]},
  NC:{name:'North Carolina',d:{s:12750,m:25500,h:19125},b:[[1e9,.045]]},
  ND:{name:'North Dakota',d:{s:14600,m:29200,h:21900},b:[[44725,.0195],[225975,.0295],[1e9,.0299]]},
  NE:{name:'Nebraska',d:{s:7900,m:15800,h:7900},b:[[3700,.0246],[22170,.0351],[35730,.0501],[1e9,.0584]]},
  NJ:{name:'New Jersey',d:{s:1000,m:2000,h:1000},b:[[20000,.014],[35000,.0175],[40000,.035],[75000,.0553],[500000,.0637],[1000000,.0897],[1e9,.1075]]},
  NM:{name:'New Mexico',d:{s:14600,m:29200,h:21900},b:[[5500,.017],[11000,.032],[16000,.047],[210000,.049],[1e9,.059]]},
  NY:{name:'New York',d:{s:8000,m:16050,h:11200},b:[[8500,.04],[11700,.045],[13900,.0525],[21400,.0585],[80650,.0625],[215400,.0685],[1077550,.0965],[5000000,.103],[1e9,.109]]},
  OH:{name:'Ohio',d:{s:0,m:0,h:0},b:[[26050,0],[100000,.02765],[1e9,.035]]},
  OK:{name:'Oklahoma',d:{s:6350,m:12700,h:6350},b:[[1000,.0025],[2500,.0075],[3750,.0175],[4900,.0275],[7200,.0375],[1e9,.0475]]},
  OR:{name:'Oregon',d:{s:2420,m:4840,h:2420},b:[[10000,.0475],[25000,.0675],[125000,.0875],[1e9,.099]]},
  PA:{name:'Pennsylvania',d:{s:0,m:0,h:0},b:[[1e9,.0307]]},
  RI:{name:'Rhode Island',d:{s:10550,m:21150,h:10550},b:[[73450,.0375],[166950,.0475],[1e9,.0599]]},
  SC:{name:'South Carolina',d:{s:14600,m:29200,h:21900},b:[[1e9,.064]]},
  UT:{name:'Utah',d:{s:876,m:1752,h:876},b:[[1e9,.0465]]},
  VA:{name:'Virginia',d:{s:8000,m:16000,h:8000},b:[[3000,.02],[5000,.03],[17000,.05],[1e9,.0575]]},
  VT:{name:'Vermont',d:{s:14600,m:29200,h:21900},b:[[45400,.0335],[110050,.066],[229550,.076],[1e9,.0875]]},
  WI:{name:'Wisconsin',d:{s:12760,m:23930,h:12760},b:[[14320,.035],[28640,.044],[315310,.053],[1e9,.0765]]},
  WV:{name:'West Virginia',d:{s:0,m:0,h:0},b:[[10000,.03],[25000,.04],[40000,.045],[60000,.06],[1e9,.065]]},
};
const FED = {
  single: { ded:14600, b:[[11600,.10],[47150,.12],[100525,.22],[191950,.24],[243725,.32],[609350,.35],[1e9,.37]] },
  mfj:    { ded:29200, b:[[23200,.10],[94300,.12],[201050,.22],[383900,.24],[487450,.32],[731200,.35],[1e9,.37]] },
  hoh:    { ded:21900, b:[[16550,.10],[63100,.12],[100500,.22],[191950,.24],[243700,.32],[609350,.35],[1e9,.37]] },
};
function bracketTax(taxable, brackets) {
  let tax=0, prev=0;
  for (const [top,rate] of brackets) { if(taxable<=prev) break; tax+=(Math.min(taxable,top)-prev)*rate; prev=top; }
  return tax;
}
function calcFederal(gross, filing) { const {ded,b}=FED[filing]; return bracketTax(Math.max(0,gross-ded),b); }
function calcFICA(gross) { return Math.min(gross,168600)*0.062 + gross*0.0145 + Math.max(0,gross-200000)*0.009; }
function calcState(gross, code, filing) {
  const s=STATES[code]; if(!s||s.b.length===0) return 0;
  const dk={single:'s',mfj:'m',hoh:'h'}[filing];
  return bracketTax(Math.max(0,gross-s.d[dk]),s.b);
}

// ─── EXPENSE BUILDER ────────────────────────────────────────────────────────
const DEFAULT_EXPENSES = [
  ['Rent / Housing',1800],['Groceries',400],['Dining Out',300],['Transportation',300],
  ['Utilities',150],['Entertainment',100],['Healthcare',150],['Subscriptions',60],
  ['Clothing',80],['Personal Care',60],['Travel',150],['Other',100],
];
let expRowCount = 0;
function buildExpenseRows() {
  document.getElementById('expenseBuilder').innerHTML = '';
  DEFAULT_EXPENSES.forEach(([n,a]) => addExpenseRow(n,a));
}
function addExpenseRow(name='', amount=0) {
  expRowCount++;
  const id = `exp-${expRowCount}`;
  const el = document.getElementById('expenseBuilder');
  const row = document.createElement('div');
  row.className='exp-row'; row.id=id;
  row.innerHTML=`<input type="text" placeholder="Category" value="${name}" oninput="updateExpenses()"/>
    <div class="money"><span>$</span><input type="number" value="${amount}" min="0" placeholder="0" oninput="updateExpenses()"/></div>
    <button onclick="removeExpRow('${id}')" title="Remove">×</button>`;
  el.appendChild(row);
  updateExpenses();
}
function removeExpRow(id) { document.getElementById(id)?.remove(); updateExpenses(); }
function getAnnualExpenses() {
  let t=0;
  document.querySelectorAll('#expenseBuilder .exp-row').forEach(r=>{t+=(parseFloat(r.querySelector('input[type="number"]')?.value)||0);});
  return t*12;
}
function updateExpenses() {
  const a=getAnnualExpenses();
  document.getElementById('expTotal').textContent='$'+Math.round(a).toLocaleString()+'/yr';
  calculate();
}

// ─── STATE DROPDOWN ─────────────────────────────────────────────────────────
function populateStates() {
  const sel=document.getElementById('state');
  Object.entries(STATES).sort((a,b)=>a[1].name.localeCompare(b[1].name)).forEach(([code,{name}])=>{
    const o=document.createElement('option'); o.value=code; o.textContent=name;
    if(code==='CA') o.selected=true; sel.appendChild(o);
  });
}

// ─── FORMAT ─────────────────────────────────────────────────────────────────
function fmt(n) { const a=Math.abs(n),s=n<0?'-':''; return a>=1e6?s+'$'+(a/1e6).toFixed(2)+'M':a>=1e3?s+'$'+(a/1e3).toFixed(1)+'K':s+'$'+a.toFixed(0); }
function fmtFull(n) { return (n<0?'-':'')+'$'+Math.round(Math.abs(n)).toLocaleString(); }
function pct(n) { return (n*100).toFixed(1)+'%'; }

// ─── WIDGET DEFINITIONS ─────────────────────────────────────────────────────
const WIDGET_DEFS = {
  milestones: { title:'Net Worth Milestones', x:0,y:0,w:12,h:2,
    html:`<div class="wbody"><div class="ms-grid">
      <div class="ms-cell"><div class="ms-yr" id="ms-lbl-10">—</div><div class="ms-val" id="kpi-yr10">—</div></div>
      <div class="ms-cell"><div class="ms-yr" id="ms-lbl-20">—</div><div class="ms-val" id="kpi-yr20">—</div></div>
      <div class="ms-cell"><div class="ms-yr" id="ms-lbl-last">—</div><div class="ms-val" id="kpi-yr30">—</div></div>
    </div></div>` },
  chart: { title:'Net Worth Projection', x:0,y:2,w:7,h:7,
    html:`<div class="wbody"><canvas id="netWorthChart"></canvas></div>` },
  table: { title:'Year-by-Year Breakdown', x:7,y:2,w:5,h:7,
    html:`<div class="wbody nopad"><div class="table-scroll"><table>
      <thead><tr><th>Year</th><th>Age</th><th>Gross</th><th>Take-Home</th><th>Expenses</th><th>Savings</th><th>Inv. Gains</th><th>Net Worth</th></tr></thead>
      <tbody id="tableBody"></tbody></table></div></div>` },
  taxes: { title:'Year-1 Tax Breakdown', x:0,y:9,w:5,h:4,
    html:`<div class="wbody"><div class="tax-bars" id="taxBars"></div></div>` },
  savings: { title:'Annual Savings Over Time', x:5,y:9,w:7,h:4,
    html:`<div class="wbody"><canvas id="savingsChart"></canvas></div>` },
};

// ─── GRID STATE ─────────────────────────────────────────────────────────────
let grid;
let editMode = false;
const visible = new Set(); // currently shown widget IDs
const charts = {};         // { netWorthChart, savingsChart }
let lastRows = [], lastTaxData = null;

function wrapWidget(id) {
  const def = WIDGET_DEFS[id];
  return `<div class="wcard" id="wcard-${id}">
    <div class="whdr">
      <span class="wdrag">⠿</span>
      <span class="wtitle">${def.title}</span>
      <button class="wclose" onclick="hideWidget('${id}')" title="Hide">×</button>
    </div>
    ${def.html}
  </div>`;
}

function cellH() {
  const main = document.getElementById('mainArea');
  const bar  = document.getElementById('editBar');
  const avail = main.clientHeight - 20 - (bar.offsetHeight||0) - 10;
  return Math.max(52, Math.floor(avail / 9));
}

function initGrid() {
  const ch = cellH();
  grid = GridStack.init({
    column: 12, cellHeight: ch, margin: 6,
    animate: true, float: false, resizable: { handles: 'se,sw,ne,nw,e,w,s' },
  }, '#grid');
  grid.setStatic(true);

  grid.on('resizestop', () => setTimeout(resizeCharts, 60));
  grid.on('change', () => { if (!editMode) saveLayout(); });

  const saved = tryLoadLayout();
  if (!saved) addDefaultWidgets();
}

function addDefaultWidgets() {
  ['milestones','chart','table'].forEach(id => {
    const d = WIDGET_DEFS[id];
    addWidgetToGrid(id, d.x, d.y, d.w, d.h);
  });
}

function addWidgetToGrid(id, x, y, w, h) {
  const def = WIDGET_DEFS[id];
  grid.addWidget({ x, y, w, h, id, content: wrapWidget(id) });
  visible.add(id);
  renderWidget(id);
  updateEditBar();
}

function hideWidget(id) {
  const el = document.querySelector(`.grid-stack-item[gs-id="${id}"]`);
  if (el) grid.removeWidget(el);
  visible.delete(id);
  updateEditBar();
  saveLayout();
}

// ─── EDIT MODE ───────────────────────────────────────────────────────────────
function toggleEdit() {
  editMode = !editMode;
  grid.setStatic(!editMode);
  document.body.classList.toggle('editing', editMode);
  const btn = document.getElementById('editBtn');
  btn.textContent = editMode ? '✓ Done' : 'Edit Layout';
  btn.classList.toggle('active', editMode);
  if (!editMode) saveLayout();
}

function updateEditBar() {
  const bar = document.getElementById('editBar');
  const chips = Object.keys(WIDGET_DEFS)
    .filter(id => !visible.has(id))
    .map(id => `<button class="add-widget-chip" onclick="restoreWidget('${id}')">+ ${WIDGET_DEFS[id].title}</button>`)
    .join('');
  bar.innerHTML = `<span class="edit-bar-label">Add widget:</span>${chips || '<span style="color:var(--muted);font-size:0.72rem">All widgets visible</span>'}`;
}

function restoreWidget(id) {
  const def = WIDGET_DEFS[id];
  addWidgetToGrid(id, def.x, def.y, def.w, def.h);
  saveLayout();
}

// ─── LAYOUT PERSISTENCE ──────────────────────────────────────────────────────
function saveLayout() {
  const items = grid.save(false);
  localStorage.setItem('nw-layout-v2', JSON.stringify({ items, visible: [...visible] }));
}

function tryLoadLayout() {
  try {
    const raw = localStorage.getItem('nw-layout-v2');
    if (!raw) return false;
    const { items, visible: vis } = JSON.parse(raw);
    vis.forEach(id => {
      const saved = items.find(i => i.id === id);
      if (saved) addWidgetToGrid(id, saved.x, saved.y, saved.w, saved.h);
      else { const d=WIDGET_DEFS[id]; addWidgetToGrid(id,d.x,d.y,d.w,d.h); }
    });
    return true;
  } catch { return false; }
}

function resetLayout() {
  localStorage.removeItem('nw-layout-v2');
  // Remove all existing widgets
  visible.forEach(id => {
    const el = document.querySelector(`.grid-stack-item[gs-id="${id}"]`);
    if (el) grid.removeWidget(el);
  });
  visible.clear();
  addDefaultWidgets();
  if (editMode) toggleEdit();
}

// ─── CHART HELPERS ───────────────────────────────────────────────────────────
const START_YEAR = new Date().getFullYear(); // 2026
const START_AGE  = 32;
function calYear(rowYear) { return START_YEAR + rowYear - 1; }
function calAge(rowYear)  { return START_AGE  + rowYear - 1; }

function resizeCharts() { Object.values(charts).forEach(c => c?.resize()); }
const chartOpts = (extraOpts={}) => ({
  responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
  interaction: { mode:'index', intersect:false },
  plugins: {
    legend: { labels: { color:'#8892a4', boxWidth:10, font:{size:10}, padding:10 } },
    tooltip: { backgroundColor:'#1a1d27', borderColor:'#2e3250', borderWidth:1,
      titleColor:'#e2e8f0', bodyColor:'#8892a4',
      callbacks: { label: c=>` ${c.dataset.label}: $${Math.round(c.parsed.y).toLocaleString()}` } }
  },
  scales: {
    x: { ticks:{color:'#8892a4',font:{size:9},maxTicksLimit:10}, grid:{color:'#2e3250'} },
    y: { ticks:{color:'#8892a4',font:{size:9},callback:v=>fmt(v)}, grid:{color:'#2e3250'} }
  }, ...extraOpts
});

// ─── WIDGET RENDERERS ────────────────────────────────────────────────────────
function renderWidget(id) {
  if (!lastRows.length && id !== 'taxes') return;
  if (id === 'milestones') renderMilestones();
  if (id === 'chart')      renderChart();
  if (id === 'table')      renderTable();
  if (id === 'taxes')      renderTaxes();
  if (id === 'savings')    renderSavings();
}

function renderMilestones() {
  if (!lastRows.length) return;
  const yr = n => lastRows[Math.min(n-1, lastRows.length-1)];
  const r10  = yr(10), r20 = yr(20), rN = lastRows[lastRows.length-1];
  document.getElementById('kpi-yr10').textContent   = fmt(r10.nw);
  document.getElementById('kpi-yr20').textContent   = fmt(r20.nw);
  document.getElementById('kpi-yr30').textContent   = fmt(rN.nw);
  document.getElementById('ms-lbl-10').textContent  = `${calYear(r10.year)} (age ${calAge(r10.year)})`;
  document.getElementById('ms-lbl-20').textContent  = `${calYear(r20.year)} (age ${calAge(r20.year)})`;
  document.getElementById('ms-lbl-last').textContent= `${calYear(rN.year)} (age ${calAge(rN.year)})`;
}

function renderChart() {
  const canvas = document.getElementById('netWorthChart');
  if (!canvas || !lastRows.length) return;
  if (charts.main) { charts.main.destroy(); delete charts.main; }
  charts.main = new Chart(canvas, {
    type:'line', options: chartOpts(),
    data: { labels: lastRows.map(r=>`${calYear(r.year)}`), datasets: [{
      label:'Net Worth', data:lastRows.map(r=>r.nw),
      borderColor:'#6c63ff', backgroundColor:'rgba(108,99,255,0.07)',
      fill:true, tension:0.4, pointRadius:0, borderWidth:2.5
    }]}
  });
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  if (!tbody || !lastRows.length) return;
  tbody.innerHTML = '';
  const milestones=[1e5,2.5e5,5e5,1e6,2e6,5e6,1e7];
  const hit=new Set();
  lastRows.forEach(r => {
    let badges='';
    milestones.forEach(m=>{if(!hit.has(m)&&r.nw>=m){hit.add(m);badges+=`<span class="mbadge">${fmt(m)}</span>`;}});
    const sc=r.annSavings>=0?'pos':'neg';
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${calYear(r.year)}${badges}</td><td style="color:var(--muted)">${calAge(r.year)}</td><td>${fmtFull(r.gross)}</td><td class="pos">${fmtFull(r.takehome)}</td><td class="neg">${fmtFull(r.exp)}</td><td class="${sc}">${fmtFull(r.annSavings)}</td><td class="pos">${fmtFull(r.investGains)}</td><td style="font-weight:700">${fmtFull(r.nw)}</td>`;
    tbody.appendChild(tr);
  });
}

function renderTaxes() {
  const el = document.getElementById('taxBars');
  if (!el || !lastTaxData) return;
  const {fed, fica, state, gross} = lastTaxData;
  const max = fed + fica + state;
  const items = [
    { label:'Federal Income Tax', val:fed, color:'#6c63ff' },
    { label:'FICA (SS + Medicare)', val:fica, color:'#00d4aa' },
    { label:'State Income Tax', val:state, color:'#ffa64d' },
  ];
  el.innerHTML = items.map(({label,val,color}) => `
    <div class="tax-bar-row">
      <span class="tax-bar-label">${label}</span>
      <div class="tax-bar-track"><div class="tax-bar-fill" style="width:${max>0?val/max*100:0}%;background:${color}"></div></div>
      <span class="tax-bar-val">${fmtFull(val)} <span style="color:var(--muted);font-size:0.7rem">(${gross>0?pct(val/gross):'—'})</span></span>
    </div>`).join('');
}

function renderSavings() {
  const canvas = document.getElementById('savingsChart');
  if (!canvas || !lastRows.length) return;
  if (charts.savings) { charts.savings.destroy(); delete charts.savings; }
  charts.savings = new Chart(canvas, {
    type:'bar', options: chartOpts({ plugins: { legend:{ labels:{color:'#8892a4',boxWidth:10,font:{size:10},padding:10} },
      tooltip:{ backgroundColor:'#1a1d27',borderColor:'#2e3250',borderWidth:1,titleColor:'#e2e8f0',bodyColor:'#8892a4',
        callbacks:{label:c=>` ${c.dataset.label}: $${Math.round(c.parsed.y).toLocaleString()}`} } } }),
    data: { labels: lastRows.map(r=>`${calYear(r.year)}`), datasets:[
      { label:'Annual Savings', data:lastRows.map(r=>r.annSavings), backgroundColor: lastRows.map(r=>r.annSavings>=0?'rgba(0,212,170,0.7)':'rgba(255,107,107,0.7)'), borderRadius:3 },
      { label:'Investment Gains', data:lastRows.map(r=>r.investGains), backgroundColor:'rgba(108,99,255,0.7)', borderRadius:3 },
    ]}
  });
}

// ─── MAIN CALCULATION ────────────────────────────────────────────────────────
function calculate() {
  const startNW      = parseFloat(document.getElementById('netWorth').value)||0;
  const salary       = parseFloat(document.getElementById('salary').value)||0;
  const filing       = document.getElementById('filingStatus').value;
  const stateCode    = document.getElementById('state').value;
  const incomeGrowth = (parseFloat(document.getElementById('incomeGrowth').value)||0)/100;
  const expGrowth    = (parseFloat(document.getElementById('expenseGrowth').value)||0)/100;
  const investReturn = (parseFloat(document.getElementById('investReturn').value)||0)/100;
  const investPct    = Math.min(1,Math.max(0,(parseFloat(document.getElementById('investPct').value)||80)/100));
  const years        = Math.min(50,Math.max(1,parseInt(document.getElementById('years').value)||30));

  const fedTax   = calcFederal(salary,filing);
  const ficaTax  = calcFICA(salary);
  const stateTax = calcState(salary,stateCode,filing);
  const totalTax = fedTax+ficaTax+stateTax;
  const effRate  = salary>0?totalTax/salary:0;

  document.getElementById('ts-fed').textContent   = fmtFull(fedTax)+` (${pct(fedTax/salary)})`;
  document.getElementById('ts-fica').textContent  = fmtFull(ficaTax)+` (${pct(ficaTax/salary)})`;
  document.getElementById('ts-state').textContent = fmtFull(stateTax)+` (${pct(stateTax/salary)})`;
  document.getElementById('ts-total').textContent = pct(effRate);
  lastTaxData = { fed:fedTax, fica:ficaTax, state:stateTax, gross:salary };

  const annExp = getAnnualExpenses();
  const rows=[]; let nw=startNW, curSal=salary, curExp=annExp;
  for (let y=1;y<=years;y++) {
    const gross=curSal, fed=calcFederal(gross,filing), fica=calcFICA(gross), st=calcState(gross,stateCode,filing);
    const takehome=gross-fed-fica-st, exp=curExp, annSavings=takehome-exp;
    const investGains=nw*investPct*investReturn;
    nw=nw+investGains+annSavings;
    rows.push({year:y,gross,takehome,exp,annSavings,investGains,nw});
    curSal*=(1+incomeGrowth); curExp*=(1+expGrowth);
  }
  lastRows = rows;

  visible.forEach(id => renderWidget(id));
}

// ─── INIT ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  grid?.cellHeight(cellH());
  setTimeout(resizeCharts, 100);
});

populateStates();
buildExpenseRows();
initGrid();
updateEditBar();
calculate();
</script>
